# Allow-list proxy in front of the local document services. Anything not listed here returns 404 — in particular the Stirling-PDF web UI and
# admin endpoints are never reachable. Request bodies are capped at 30 MB. scripts/services-lock.cjs checks that this list matches versions.lock.json.
server {
  listen 80;
  server_tokens off;
  client_max_body_size 30m;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_hide_header X-Powered-By;

  # Gotenberg — Word / Excel / PowerPoint (incl. legacy .doc/.xls/.ppt) → PDF
  location = /gotenberg/health                    { proxy_pass http://gotenberg:3000/health; }
  location = /gotenberg/forms/libreoffice/convert { proxy_pass http://gotenberg:3000/forms/libreoffice/convert; }

  # Stirling-PDF — server-side OCR and compression for files too big for the browser
  location = /stirling/api/v1/info/status         { proxy_pass http://stirling:8080/api/v1/info/status; }
  location = /stirling/api/v1/misc/compress-pdf   { proxy_pass http://stirling:8080/api/v1/misc/compress-pdf; }
  location = /stirling/api/v1/misc/ocr-pdf        { proxy_pass http://stirling:8080/api/v1/misc/ocr-pdf; }

  # LanguageTool — spelling and grammar for the Word editor
  location = /languagetool/v2/languages           { proxy_pass http://languagetool:8010/v2/languages; }
  location = /languagetool/v2/check               { proxy_pass http://languagetool:8010/v2/check; }

  location / { return 404; }
}
