# Local document services for ClaimsIQ — pinned, offline, same-machine only.
#
#   cd deploy/services && docker compose up -d
#   node ../../scripts/services-lock.cjs --live      # checks the pins and that the services answer
#
# Why this is safe for PHI:
#  * images are pinned by tag AND digest (versions.lock.json is the single source of truth; scripts/services-lock.cjs fails if this file drifts)
#  * the three services sit on an *internal* Docker network: they have no route to the internet
#  * only the small allow-list proxy publishes a port, and only on 127.0.0.1 — your web server forwards /svc/ to it (see deploy/nginx.conf, deploy/Caddyfile)
#  * nothing is written to disk except temporary conversion files inside the containers (tmpfs, wiped on restart)
#  * analytics / update checks are switched off
# Upgrading: change the tag + digest here AND in versions.lock.json, re-run the lock check, then test the Studio and Document OCR pages.

name: claimsiq-doc-services

services:
  proxy:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports: ["127.0.0.1:8088:80"]
    volumes: ["./proxy.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [edge, internal]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [gotenberg, stirling, languagetool]

  gotenberg:
    image: gotenberg/gotenberg:8.38.1@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s"]
    networks: [internal]
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  stirling:
    image: stirlingtools/stirling-pdf:2.11.0@sha256:b75b5ae2fcb75948f468718ed4c0bd499a8cafc9daf7f90f4c1e0e5a6acf9df8
    restart: unless-stopped
    environment:
      SYSTEM_ENABLEANALYTICS: "false"
      LANGS: "en_US"
    networks: [internal]
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  languagetool:
    image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  internal:
    internal: true   # no internet access for the services
