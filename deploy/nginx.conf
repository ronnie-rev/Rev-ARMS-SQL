# nginx server block for the ClaimsIQ static app (VPS). Replace YOUR-DOMAIN and the certificate paths (certbot/Let's Encrypt or your CA).
server {
  listen 80;  server_name YOUR-DOMAIN;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;  server_name YOUR-DOMAIN;
  ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /var/www/claimsiq/dist;  index index.html;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://clinicaltables.nlm.nih.gov; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  types { application/wasm wasm; }
  location = /index.html   { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /version.json { add_header Cache-Control "no-store" always; }
  location /assets/        { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  # Local document services (Gotenberg / Stirling-PDF / LanguageTool) — see deploy/services. Same origin, so the CSP stays 'self'. No add_header here so the security headers above are inherited.
  location /svc/           { proxy_pass http://127.0.0.1:8088/; client_max_body_size 30m; proxy_read_timeout 180s; proxy_http_version 1.1; }
  location /               { try_files $uri $uri/ /index.html; }
}
